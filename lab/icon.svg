<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Factory Flow Lab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23909c"/>
      <stop offset="1" stop-color="#14505a"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (maskable: the drawing stays in the central safe zone) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the best-case throughput curve: it rises with the WIP, then the bottleneck caps it -->
  <polyline points="118,268 168,214 218,160 268,128 318,128 368,128 398,128" fill="none" stroke="#f2a65a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f2a65a">
    <circle cx="168" cy="214" r="15"/><circle cx="218" cy="160" r="15"/><circle cx="268" cy="128" r="15"/>
    <circle cx="318" cy="128" r="15"/><circle cx="368" cy="128" r="15"/>
  </g>
  <!-- the line: three stations and the parts flowing between them -->
  <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="round">
    <rect x="96" y="300" width="80" height="80" rx="16"/>
    <rect x="216" y="300" width="80" height="80" rx="16"/>
    <rect x="336" y="300" width="80" height="80" rx="16"/>
  </g>
  <g fill="#ffffff">
    <path d="M182 340 h22 l-8 -9 M204 340 l-8 9" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M302 340 h22 l-8 -9 M324 340 l-8 9" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <rect x="120" y="324" width="32" height="32" rx="6" fill="#8fd3c7"/>
  <rect x="240" y="324" width="32" height="32" rx="6" fill="#f2a65a"/>
  <rect x="360" y="324" width="32" height="32" rx="6" fill="#d6e8ea"/>
  <!-- the walkway with a worker -->
  <line x1="110" y1="420" x2="402" y2="420" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="14 14" stroke-linecap="round"/>
  <circle cx="256" cy="420" r="22" fill="#ffffff"/>
  <circle cx="256" cy="414" r="7" fill="#14505a"/>
  <path d="M243 433 a13 11 0 0 1 26 0 z" fill="#14505a"/>
</svg>
